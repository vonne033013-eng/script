<style>
/* ─── OPENLANE BRAND COLORS (MANUAL COMPLIANT) ─── */
:root {
  --primary:        #0061FF;
  --primary-glow:   rgba(0,97,255,0.18);
  --secondary:      #0A1B5F;
  --gradient-start: #0061FF;
  --gradient-end:   #0A1B5F;
  --blue-25:  #F5F9FF;
  --blue-50:  #E5EFFF;
  --blue-100: #CCE0FF;
  --blue-200: #99C0FF;
  --blue-300: #66A1FF;
  --blue-900: #CCD8FF;
  --white:          #FFFFFF;
  --silver-light1:  #F9F9F9;
  --silver-light2:  #F5F5F5;
  --silver:         #C3C3C3;
  --silver-medium:  #707070;
  --silver-dark:    #262626;
  --asphalt:        #000000;
  --bg:       var(--blue-25);
  --card:     var(--white);
  --border:   var(--blue-50);
  --sub:      var(--silver-medium);
  --text:     var(--secondary);
  --sidebar:  var(--secondary);
  --green:  #10B981;
  --amber:  #F59E0B;
  --red:    #EF4444;
  --purple: #8B5CF6;
  --teal:   #06B6D4;
  --shadow-sm:  0 2px 8px rgba(10,27,95,0.06);
  --shadow-md:  0 8px 32px rgba(10,27,95,0.08);
  --shadow-lg:  0 20px 60px rgba(10,27,95,0.12);
  --shadow-xl:  0 32px 80px rgba(10,27,95,0.18);
  --r:    20px;
  --r-sm: 10px;
  --r-xs: 6px;
}

/* ─── DARK THEME ─── */
[data-theme="dark"] {
  --bg:      #080D18;
  --card:    #0F1629;
  --border:  #1A2340;
  --text:    #E8EDF8;
  --sub:     #8895B0;
  --sidebar: #0C1220;
  --shadow-sm:  0 2px 8px rgba(0,0,0,0.3);
  --shadow-md:  0 8px 32px rgba(0,0,0,0.4);
  --shadow-lg:  0 20px 60px rgba(0,0,0,0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body {
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  transition: background 0.4s ease, color 0.4s ease;
  -webkit-text-size-adjust: 100%;
}
body.modal-active-lock { overflow: hidden !important; height: 100vh !important; }

/* ═══════════════════════════════════════════════
   AUTHENTICATION GATEWAY
═══════════════════════════════════════════════ */
.login-page {
  height: 100vh; width: 100%; display: flex; flex-direction: column; justify-content: center;
  align-items: center;
  position: fixed; top: 0; left: 0; z-index: 300; background: var(--bg); padding: 20px;
  transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
  will-change: transform, opacity; overflow: hidden;
}
.login-page.out { transform: translateY(-100vh); opacity: 0; pointer-events: none; }
.login-page::before {
  content: ''; position: absolute; width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,97,255,0.07) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
}
.login-card {
  background: var(--card);
  border: 1.5px solid var(--border); border-radius: var(--r);
  padding: 48px 40px; box-shadow: var(--shadow-lg); text-align: center; max-width: 400px; width: 100%;
  position: relative; z-index: 2;
}
.login-brand-logo { width: 80px; height: 80px; margin-bottom: 24px; object-fit: contain; filter: drop-shadow(0 8px 24px rgba(0,97,255,0.22)); }
.login-card h2 { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.login-card p { font-size: 13px; color: var(--sub); margin-bottom: 32px; line-height: 1.6; }
.auth-btn {
  width: 100%; padding: 14px; border-radius: 50px; border: none; cursor: pointer; font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white;
  box-shadow: 0 8px 24px rgba(0,97,255,0.25); transition: all 0.2s ease;
}
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,97,255,0.3); }
.auth-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
.auth-error-msg { margin-top: 20px; font-size: 12px; color: var(--red); font-weight: 600; min-height: 18px; }
.spinning-icon { animation: spinLoop 0.8s linear infinite; }

/* ═══════════════════════════════════════════════
   ACCESS DENIED OVERLAY
═══════════════════════════════════════════════ */
.access-denied-mask {
   position: fixed; top: 0; left: 0; width: 100%; height: 100%;
   background: #080D18; z-index: 9999;
   display: flex; flex-direction: column; align-items: center; justify-content: center;
   color: white; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
}
.access-denied-mask.active { opacity: 1; pointer-events: auto; }
.lock-icon-lg { font-size: 64px; color: var(--primary); margin-bottom: 24px; }

/* ═══════════════════════════════════════════════
   SPLASH / TITLE PAGE
═══════════════════════════════════════════════ */
.title-page {
  height: 100vh; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
  position: fixed; top: 0; left: 0; z-index: 100; background: var(--bg); text-align: center; padding: 20px;
  transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease, visibility 0.7s; will-change: transform, opacity; overflow: hidden;
}
.title-page::before { content: ''; position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(0,97,255,0.07) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -60%); pointer-events: none; }
.title-stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end)); }
.brand-logo { width: 120px; height: 120px; margin-bottom: 28px; object-fit: contain; opacity: 0; transform: translateY(24px) scale(0.9); transition: transform 1.1s cubic-bezier(0.34,1.56,0.64,1), opacity 0.9s ease; filter: drop-shadow(0 12px 32px rgba(0,97,255,0.22)); }
.brand-logo.loaded { opacity: 1; transform: translateY(0) scale(1); }
.title-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; opacity: 0; transform: translateY(12px); transition: transform 0.9s cubic-bezier(0.25,1,0.5,1) 0.3s, opacity 0.9s ease 0.3s; }
.title-eyebrow.loaded { opacity: 1; transform: translateY(0); }
.title-page h1 { font-size: 3.4rem; font-weight: 800; letter-spacing: -1.5px; color: var(--text); margin-bottom: 10px; opacity: 0; transform: translateY(20px); transition: transform 1s cubic-bezier(0.25,1,0.5,1) 0.45s, opacity 1s ease 0.45s; line-height: 1.1; }
.title-page h1.loaded { opacity: 1; transform: translateY(0); }
.title-page p { font-size: 12px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--primary); margin-bottom: 48px; opacity: 0; transform: translateY(16px); transition: transform 1s cubic-bezier(0.25,1,0.5,1) 0.6s, opacity 1s ease 0.6s; }
.title-page p.loaded { opacity: 1; transform: translateY(0); }
.title-hub-menu-controls { display: flex; gap: 14px; opacity: 0; transform: translateY(16px); transition: transform 1s cubic-bezier(0.25,1,0.5,1) 0.75s, opacity 1s ease 0.75s; flex-wrap: wrap; justify-content: center; }
.title-hub-menu-controls.loaded { opacity: 1; transform: translateY(0); }

.hub-entry-btn { padding: 15px 32px; border-radius: 50px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; display: flex; align-items: center; gap: 9px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; box-shadow: 0 8px 24px rgba(0,97,255,0.25); transition: all 0.25s cubic-bezier(0.25,0.8,0.25,1); position: relative; overflow: hidden; }
.hub-entry-btn::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.2s ease; }
.hub-entry-btn:hover::after { background: rgba(255,255,255,0.08); }
.hub-entry-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(0,97,255,0.3); }
.hub-entry-btn.btn-alt { background: var(--card); color: var(--text); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); }
.hub-entry-btn.btn-alt:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 8px 24px rgba(0,97,255,0.3); transform: translateY(-3px); }

[data-theme="dark"] .hub-entry-btn { background: linear-gradient(135deg, var(--primary) 0%, #1A3A9F 100%); }
[data-theme="dark"] .hub-entry-btn.btn-alt { background: var(--card); color: var(--text); }
[data-theme="dark"] .hub-entry-btn.btn-alt:hover { background: var(--primary); color: white; border-color: var(--primary); }

.title-page.out { transform: translateY(-12vh) scale(0.96); opacity: 0; visibility: hidden; pointer-events: none; transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, visibility 0.45s; }

.scroll-indicator { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: var(--primary); opacity: 0; transition: opacity 1s ease 1.2s; pointer-events: none; }
.scroll-indicator.loaded { opacity: 1; animation: pulseBounce 2s infinite ease-in-out; pointer-events: auto; cursor: pointer; }
.scroll-indicator .material-icons-round { font-size: 36px; }

@keyframes pulseBounce {
  0%, 100% { transform: translate(-50%, 0); opacity: 0.6; }
  50% { transform: translate(-50%, 12px); opacity: 1; }
}

/* ═══════════════════════════════════════════════
   MAIN CONTENT WRAPPER & SHELL
═══════════════════════════════════════════════ */
.main-content-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 50; background: var(--bg); transform: translateY(14vh) scale(0.97); opacity: 0; visibility: hidden; pointer-events: none; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease, visibility 0.5s; will-change: transform, opacity; }
.main-content-wrapper.reveal { transform: translateY(0) scale(1); opacity: 1; visibility: visible; pointer-events: auto; }

.shell { display: grid; grid-template-columns: 272px minmax(0,1fr); height: 100vh; transition: grid-template-columns 0.4s cubic-bezier(0.25,1,0.5,1); }
.shell.sidebar-collapsed { grid-template-columns: 76px minmax(0,1fr); }
.sidebar { background: var(--sidebar); color: #fff; display: flex; flex-direction: column; padding: 0; height: 100vh; overflow: hidden; position: relative; transition: background 0.3s ease; border-right: 1px solid rgba(255,255,255,0.04); }
.sidebar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), #4A90FF); }
.sidebar-top-branding-row { display: flex; align-items: center; justify-content: space-between; padding: 28px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); gap: 12px; transition: padding 0.4s cubic-bezier(0.25,1,0.5,1); flex-shrink: 0; }
.shell.sidebar-collapsed .sidebar-top-branding-row { padding: 28px 16px 20px; justify-content: center; }
.logo-mark { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-image-container { width: 40px; height: 40px; background: #FFFFFF; border-radius: var(--r-xs); display: flex; align-items: center; justify-content: center; padding: 5px; flex-shrink: 0; transition: transform 0.4s cubic-bezier(0.25,1,0.5,1); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.shell.sidebar-collapsed .logo-image-container { transform: scale(0.95); }
.sidebar-brand-img { width: 100%; height: 100%; object-fit: contain; }
.logo-metadata-text { transition: opacity 0.2s ease, width 0.4s cubic-bezier(0.25,1,0.5,1); overflow: hidden; min-width: 0; }
.shell.sidebar-collapsed .logo-metadata-text { opacity: 0; width: 0; pointer-events: none; display: none; }
.logo-text { font-size: 14px; font-weight: 700; color: white; line-height: 1.2; white-space: nowrap; }
.logo-sub { font-size: 9px; color: rgba(255,255,255,0.38); margin-top: 2px; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }
.sidebar-collapse-toggle-trigger { width: 32px; height: 32px; border-radius: var(--r-xs); background: rgba(255,255,255,0.07); border: none; color: rgba(255,255,255,0.6); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; flex-shrink: 0; }
.shell.sidebar-collapsed .sidebar-collapse-toggle-trigger { position: absolute; top: 80px; left: calc(50% - 16px); background: rgba(255,255,255,0.1); }
.sidebar-collapse-toggle-trigger:hover { background: rgba(255,255,255,0.14); color: white; }
.sidebar-nav { padding: 24px 14px 12px; white-space: nowrap; flex: 1; overflow: hidden; transition: margin-top 0.3s ease; }
.shell.sidebar-collapsed .sidebar-nav { margin-top: 48px; }
.nav-section-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.28); font-weight: 600; padding: 0 10px; margin-bottom: 10px; margin-top: 4px; transition: opacity 0.2s ease; }
.shell.sidebar-collapsed .nav-section-label { opacity: 0; }
.nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 12px; border-radius: var(--r-xs); cursor: pointer; font-weight: 500; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 4px; transition: all 0.2s cubic-bezier(0.25,0.8,0.25,1); position: relative; overflow: hidden; }
.nav-item .material-icons-round { font-size: 19px; flex-shrink: 0; }
.nav-item span:last-child { transition: opacity 0.2s ease; opacity: 1; white-space: nowrap; }
.shell.sidebar-collapsed .nav-item span:last-child { opacity: 0; pointer-events: none; }
.nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
.nav-item.active { background: rgba(0,97,255,0.2); color: white; border: 1px solid rgba(0,97,255,0.35); }
.nav-item.active .material-icons-round { color: var(--primary); }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; transition: padding 0.4s ease; }
.shell.sidebar-collapsed .sidebar-footer { padding: 16px; display: flex; justify-content: center; }
.sidebar-version-tag { font-size: 9px; color: rgba(255,255,255,0.22); letter-spacing: 1px; text-transform: uppercase; font-weight: 500; white-space: nowrap; }
.shell.sidebar-collapsed .sidebar-version-tag { display: none; }

.main { padding: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); }
.topbar-wrapper { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 68px; flex-shrink: 0; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 0 var(--border), var(--shadow-sm); }
.topbar-left-cluster { display: flex; align-items: center; gap: 16px; min-width: 0; }
.return-hub-arrow-trigger-btn { background: transparent; border: 1.5px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sub); transition: all 0.2s cubic-bezier(0.25,0.8,0.25,1); flex-shrink: 0; }
.return-hub-arrow-trigger-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); transform: translateY(-1px); }
.topbar-title-block { min-width: 0; }
.topbar-breadcrumb { font-size: 10px; font-weight: 600; color: var(--primary); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1px; }
.topbar-heading { font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right-cluster { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.date-chip { background: var(--blue-25); border: 1.5px solid var(--blue-100); padding: 8px 18px; border-radius: 50px; font-size: 12px; font-weight: 600; color: var(--secondary); white-space: nowrap; }
[data-theme="dark"] .date-chip { background: rgba(0,97,255,0.08); border-color: rgba(0,97,255,0.25); color: var(--blue-900); }
.topbar-action-icon-btn { background: var(--bg); border: 1.5px solid var(--border); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sub); transition: all 0.2s cubic-bezier(0.25,0.8,0.25,1); flex-shrink: 0; }
.topbar-action-icon-btn .material-icons-round { font-size: 18px; }
.topbar-action-icon-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,97,255,0.12); }
.topbar-action-icon-btn.spinning-icon span { animation: spinLoop 0.8s linear infinite; }
.scroll-zone { padding: 32px 40px 48px; flex: 1; }

/* ═══════════════════════════════════════════════
   KPI STRIP
═══════════════════════════════════════════════ */
.kpi-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 32px; flex-shrink: 0; }
.kpi { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r); padding: 24px 24px 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: transform 0.25s cubic-bezier(0.25,0.8,0.25,1), box-shadow 0.25s ease, border-color 0.2s ease, opacity 0.4s ease; position: relative; overflow: hidden; opacity: 0; animation: kpiReveal 0.5s cubic-bezier(0.25,1,0.5,1) forwards; }
.kpi:nth-child(1) { animation-delay: 0.05s; }
.kpi:nth-child(2) { animation-delay: 0.13s; }
.kpi:nth-child(3) { animation-delay: 0.21s; }
@keyframes kpiReveal {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); opacity: 0; transition: opacity 0.25s ease; }
.kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--blue-100); }
.kpi:hover::before { opacity: 1; }
.kpi-row { display: flex; justify-content: space-between; align-items: center; }
.kpi-label { font-size: 10px; font-weight: 700; color: var(--sub); letter-spacing: 1px; text-transform: uppercase; }
.kpi-icon { width: 32px; height: 32px; border-radius: var(--r-xs); background: var(--blue-25); display: flex; align-items: center; justify-content: center; }
.kpi-icon .material-icons-round { font-size: 16px; color: var(--primary); }
[data-theme="dark"] .kpi-icon { background: rgba(0,97,255,0.12); }
.kpi-value { font-size: 38px; font-weight: 800; color: var(--text); letter-spacing: -2px; line-height: 1; margin-top: 4px; }
.kpi-bar { height: 4px; background: var(--border); border-radius: 50px; margin-top: 12px; overflow: hidden; }
.kpi-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 50px; transition: width 1s cubic-bezier(0.25,1,0.5,1); }

.workspace-view-panel { 
  display: none;
  min-width: 0; 
  opacity: 0; transform: translateY(18px) scale(0.99);
  transition: opacity 0.38s cubic-bezier(0.25,1,0.5,1), transform 0.38s cubic-bezier(0.25,1,0.5,1);
  will-change: opacity, transform;
}
.workspace-view-panel.active-view { 
  display: block; 
  animation: panelReveal 0.42s cubic-bezier(0.25,1,0.5,1) forwards;
}
@keyframes panelReveal {
  from { opacity: 0; transform: translateY(18px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ═══════════════════════════════════════════════
   GRID LAYOUTS (TRACKER)
═══════════════════════════════════════════════ */
.console-split-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr); gap: 24px; align-items: start; }

.unified-roster-box, .vl-application-section-box { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r); padding: 28px; box-shadow: var(--shadow-sm); min-width: 0; transition: transform 0.25s cubic-bezier(0.25,0.8,0.25,1), box-shadow 0.25s ease; }
.unified-roster-box:hover, .vl-application-section-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.unified-roster-box { min-height: 480px; display: flex; flex-direction: column; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--text); }
.card-badge { background: var(--blue-25); color: var(--primary); border: 1px solid var(--blue-100); font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 50px; text-transform: uppercase; }
[data-theme="dark"] .card-badge { background: rgba(0,97,255,0.1); border-color: rgba(0,97,255,0.3); }

/* Updated Roster Lists */
.roster-list { display: flex; flex-direction: column; max-height: 420px; overflow-y: auto; padding-right: 4px; flex: 1; }
.roster-list::-webkit-scrollbar { width: 4px; }
.roster-list::-webkit-scrollbar-track { background: transparent; }
.roster-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 50px; }

.roster-row-item { display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); gap: 8px; min-width: 0; transition: background 0.15s ease; }
.roster-row-item:last-child { border-bottom: none; }
.roster-row-item:hover { background: var(--blue-25); margin: 0 -6px; padding: 13px 6px; border-radius: var(--r-xs); }
[data-theme="dark"] .roster-row-item:hover { background: rgba(0,97,255,0.05); }

.member-profile-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.roster-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0.5px; }
.member-name { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-action-controls-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

.action-pill { padding: 6px 8px; border-radius: var(--r-xs); font-size: 10px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--border); background: var(--bg); color: var(--sub); text-transform: uppercase; transition: all 0.15s ease; min-width: 42px; text-align: center; flex-shrink: 0; letter-spacing: 0.3px; }
.action-pill:hover { border-color: var(--silver); color: var(--text); }
.roster-row-item .action-pill.active { color: white; border-color: transparent; }
.roster-row-item .action-pill.b-off.active  { background: #4B5563; }
.roster-row-item .action-pill.b-sl.active   { background: #F43F5E; }
.roster-row-item .action-pill.b-p.active    { background: var(--green); }
.roster-row-item .action-pill.b-abs.active  { background: var(--red); }
.roster-row-item .action-pill.b-h.active    { background: var(--teal); }
.automated-leave-lock { padding: 6px 12px; border-radius: var(--r-xs); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; text-align: center; min-width: 120px; white-space: nowrap; display: flex; align-items: center; gap: 6px; justify-content: center; flex-shrink: 0; }
.lock-vl   { background: #F5F3FF; color: #6D28D9; border: 1.5px dashed #C084FC; }
.lock-hdvl { background: var(--blue-25); color: var(--primary); border: 1.5px dashed var(--blue-200); }
.lock-bl   { background: #FEF9E7; color: #92400E; border: 1.5px dashed #FCD34D; }
[data-theme="dark"] .lock-vl   { background: rgba(109,40,217,0.12); }
[data-theme="dark"] .lock-hdvl { background: rgba(0,97,255,0.1); }
[data-theme="dark"] .lock-bl   { background: rgba(245,158,11,0.1); }

/* VL FORM & CALENDAR */
.vl-application-section-box { min-width: 0; }
.section-subtitle { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--sub); letter-spacing: 1px; margin-bottom: 22px; margin-top: -12px; }
.filing-mini-form { display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; border-bottom: 1px dashed var(--border); margin-bottom: 24px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.form-group-full { grid-column: span 2; }
.form-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--sub); letter-spacing: 0.8px; }
.form-select, .form-input { padding: 11px 13px; border-radius: var(--r-xs); border: 1.5px solid var(--border); font-size: 13px; font-weight: 500; color: var(--text); background: var(--bg); outline: none; width: 100%; transition: border-color 0.2s ease, box-shadow 0.2s ease; font-family: 'Poppins', sans-serif; }
.form-select:focus, .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.file-submit-btn { padding: 13px; border-radius: var(--r-xs); border: none; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,97,255,0.22); transition: all 0.2s ease; margin-top: 2px; font-family: 'Poppins', sans-serif; }
.file-submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,97,255,0.3); }
.calendar-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.calendar-month-title { font-size: 13px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }
.calendar-legend { display: flex; align-items: center; gap: 6px; }
.cal-legend-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); }
.cal-legend-label { font-size: 9px; font-weight: 600; color: var(--sub); letter-spacing: 0.5px; text-transform: uppercase; }
.calendar-grid-wrapper { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; min-width: 0; }
.calendar-day-label { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--sub); text-align: center; padding: 4px 0 6px; letter-spacing: 0.5px; }
.calendar-cell { background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-xs); min-height: 48px; padding: 5px; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: all 0.15s ease; min-width: 0; cursor: default; }
.calendar-cell .day-number { font-size: 10px; font-weight: 700; color: var(--sub); }
.calendar-cell.weekend-rest-day { background: var(--silver-light2); }
[data-theme="dark"] .calendar-cell.weekend-rest-day { background: rgba(255,255,255,0.02); }
.calendar-cell.weekend-rest-day .day-number { color: var(--silver); }
.calendar-cell.has-active-leaves { background: #F5F0FF; border-color: #DDD6FE; cursor: pointer; }
[data-theme="dark"] .calendar-cell.has-active-leaves { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.35); }
.calendar-cell.has-active-leaves:hover { border-color: var(--primary); transform: scale(1.04); box-shadow: 0 4px 12px rgba(0,97,255,0.12); }
.calendar-cell.has-active-leaves .day-number { color: var(--primary); font-weight: 800; }
.leave-indicator-dot-track { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.leave-micro-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--purple); }
.leave-micro-dot.type-hdvl { background: var(--primary); }
.leave-micro-dot.type-bl { background: var(--amber); }

/* ═══════════════════════════════════════════════
   ORG CHART / DEMOGRAPHICS
═══════════════════════════════════════════════ */
.org-chart-wrapper {
  background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r);
  padding: 40px 30px; box-shadow: var(--shadow-sm);
  overflow-x: hidden; /* Fix: Eliminates horizontal scrolling */
  min-height: calc(100vh - 200px);
}
.org-chart-title { font-size: 28px; font-weight: 800; color: var(--asphalt); margin-bottom: 40px; text-align: center; }
[data-theme="dark"] .org-chart-title { color: var(--text); }

.org-tree { 
  display: flex; flex-direction: column; align-items: center; 
  position: relative; width: 100%; max-width: 1200px; margin: 0 auto;
}

/* Level 1: Directors */
.org-directors { display: flex; justify-content: center; gap: 60px; position: relative; margin-bottom: 30px; width: 100%;}
.director-link-line { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 340px; border-top: 1.5px dashed var(--silver-medium); z-index: 1;}
.director-down-line { position: absolute; top: 30px; left: 50%; width: 1.5px; height: 60px; background: var(--silver-medium); z-index: 1;}

.director-card { display: flex; align-items: center; gap: 16px; background: var(--bg); padding: 8px 16px; border-radius: 50px; z-index: 2; position: relative;}
.director-avatar { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--card); box-shadow: var(--shadow-sm); flex-shrink: 0;}
.director-info { text-align: left; }
.director-name { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 2px;}
.director-role { font-size: 11px; color: var(--text); font-weight: 500; line-height: 1.3;}

/* Level 2: Team Lead */
.org-lead { display: flex; flex-direction: column; align-items: center; position: relative; margin-bottom: 0; z-index: 2;}
.lead-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--card); box-shadow: var(--shadow-md); overflow: hidden; position: relative; z-index: 3;}
.lead-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lead-badge { background: var(--secondary); color: white; padding: 20px 24px 8px; border-radius: var(--r-xs); text-align: center; margin-top: -15px; z-index: 2; box-shadow: var(--shadow-sm); min-width: 160px;}
.lead-name { font-size: 12px; font-weight: 700; color: white;}
.lead-role { font-size: 10px; color: var(--blue-200); font-weight: 500;}

.lead-down-line { width: 1.5px; height: 40px; background: var(--silver-medium); margin: 0 auto; z-index: 1;}

/* Level 3: Team Members Row */
.org-team-row { display: flex; justify-content: center; position: relative; padding-top: 20px; width: 100%; flex-wrap: wrap; gap: 15px; }

/* Dynamic Member Nodes */
.org-member-node { flex: 1 1 120px; max-width: 140px; display: flex; flex-direction: column; align-items: center; position: relative; padding: 0 5px; margin-bottom: 15px; }

.member-avatar { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--card); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: 700; margin-top: 20px;}
.member-name { font-size: 13px; font-weight: 700; color: var(--primary); text-align: center; line-height: 1.2;}

/* View Details Button */
.btn-view-profile-micro { margin-top: 10px; background: transparent; border: 1.5px solid var(--border); color: var(--sub); font-size: 9px; font-weight: 700; padding: 5px 12px; border-radius: 50px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;}
.btn-view-profile-micro:hover { background: var(--blue-25); color: var(--primary); border-color: var(--blue-100); }
[data-theme="dark"] .btn-view-profile-micro:hover { background: rgba(0,97,255,0.1); border-color: rgba(0,97,255,0.3); }

/* ─── SMART RESPONSIVE CHART LOGIC ─── */

/* Desktop: Draw the branching connecting lines and keep everyone in one row */
@media(min-width: 1100px) {
  .org-team-row { flex-wrap: nowrap; gap: 0; }
  .org-member-node::before { content: ''; position: absolute; top: 0; left: 50%; width: 1.5px; height: 20px; background: var(--silver-medium); }
  .org-member-node::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1.5px; background: var(--silver-medium); }
  .org-member-node:first-child::after { left: 50%; width: 50%; }
  .org-member-node:last-child::after { left: 0; width: 50%; }
  .org-member-node:first-child:last-child::after { display: none; }
}

/* Small Laptops, Tablets, & Mobile: Remove lines and wrap into a grid */
@media(max-width: 1099px) {
  .org-chart-wrapper { padding: 30px 15px; }
  .org-directors { flex-direction: column; align-items: center; gap: 20px; margin-bottom: 40px; }
  .director-link-line, .director-down-line { display: none; }
  .member-avatar { margin-top: 0; } /* Remove extra space meant for the top lines */
  .org-team-row { padding-top: 10px; gap: 25px; }
  .lead-down-line { height: 25px; }
}

/* ─── PROJECT HANDOFFS VIEW STYLES ─── */
.handoff-header-banner { background: var(--secondary); border-radius: var(--r); padding: 32px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
.handoff-header-title h2 { font-size: 24px; font-weight: 800; margin: 8px 0 0 0; }
.handoff-header-title p { font-size: 13px; color: var(--blue-100); margin-top: 6px; }

.handoff-split-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: start; }
.handoff-card-box { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
.handoff-card-title { font-size: 12px; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

/* Dynamic Chips for Suggested Leaves */
.suggested-leaves-wrapper { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.suggested-leaves-label { font-size: 9px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; width: 100%; margin-bottom: 2px; }
.suggested-leave-chip { background: var(--blue-25); color: var(--primary); font-size: 10px; font-weight: 700; padding: 6px 12px; border-radius: 50px; cursor: pointer; border: 1px solid var(--blue-100); transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase; }
.suggested-leave-chip:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(0,97,255,0.15); transform:translateY(-1px); }

.diagnostics-box { background: var(--blue-25); border: 1px solid var(--blue-100); border-radius: var(--r-sm); padding: 16px; display: flex; gap: 12px; margin-top: 20px; }
.diagnostics-box .material-icons-round { color: var(--primary); font-size: 20px; }
.diagnostics-text { font-size: 12px; color: var(--secondary); line-height: 1.5; }

.task-item-card { border: 1.5px solid var(--border); border-radius: var(--r-sm); padding: 16px; margin-bottom: 12px; }
.task-tags-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
.task-tag { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
.tag-blue { background: var(--blue-25); color: var(--primary); }
.tag-red { background: #FEF2F2; color: var(--red); }
.task-name { font-size: 14px; font-weight: 700; color: var(--secondary); margin-bottom: 16px; }
.task-mates-row { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; border-top: 1px dashed var(--border); padding-top: 12px; }
.mate-primary { color: var(--secondary); }
.mate-backup { background: #ECFDF5; color: #059669; padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; gap: 4px; }

.preview-input { width: 100%; padding: 12px; border: 1.5px solid var(--blue-100); background: var(--blue-25); border-radius: var(--r-sm); font-size: 12px; font-weight: 700; color: var(--secondary); margin-bottom: 16px; outline: none; transition: border-color 0.2s; }
.preview-input:focus { border-color: var(--primary); background: #fff; }
.preview-textarea { width: 100%; height: 350px; padding: 16px; border: 1.5px solid var(--blue-100); background: var(--blue-25); border-radius: var(--r-sm); font-size: 13px; color: var(--secondary); line-height: 1.6; resize: none; outline: none; font-family: 'Poppins', sans-serif; transition: border-color 0.2s; }
.preview-textarea:focus { border-color: var(--primary); background: #fff; }

.btn-draft-email { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: var(--r-sm); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; margin-top: 16px; box-shadow: 0 4px 14px rgba(0,97,255,0.25); transition: transform 0.2s; }
.btn-draft-email:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,97,255,0.35); }
.btn-draft-email:disabled { background: var(--silver-medium); cursor: not-allowed; transform: none; box-shadow: none; }

/* MODALS & TOASTS */
.universal-backdrop-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,27,95,0.45); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s cubic-bezier(0.25,1,0.5,1); padding: 16px; }
.universal-backdrop-mask.active { opacity: 1; pointer-events: auto; }
.modal-surface-container { background: var(--card); border-radius: var(--r); width: 100%; max-width: 500px; padding: 28px; box-shadow: var(--shadow-xl); border: 1.5px solid var(--border); transform: scale(0.92) translateY(16px); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); position: relative; overflow: hidden; }
.modal-surface-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
.universal-backdrop-mask.active .modal-surface-container { transform: scale(1) translateY(0); }
.modal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
.modal-title-text { font-size: 15px; font-weight: 700; color: var(--text); }
.modal-close-btn { background: var(--bg); border: 1.5px solid var(--border); color: var(--sub); width: 30px; height: 30px; border-radius: 50%; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
.modal-close-btn:hover { background: var(--red); color: white; border-color: var(--red); }
.modal-profile-scroll-zone, .modal-roster-list { max-height: 340px; overflow-y: auto; padding-right: 4px; }
.modal-profile-scroll-zone::-webkit-scrollbar, .modal-roster-list::-webkit-scrollbar { width: 4px; }
.modal-profile-scroll-zone::-webkit-scrollbar-thumb, .modal-roster-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 50px; }
.demographics-profile-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.profile-meta-field { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: var(--bg); border-radius: var(--r-xs); border: 1.5px solid var(--border); gap: 10px; }
.field-label-text { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--sub); letter-spacing: 0.5px; white-space: nowrap; }
.field-value-text { font-size: 12px; font-weight: 600; color: var(--text); text-align: right; word-break: break-word; }
.sprout-surface { text-align: center; }
.sprout-icon-shield { width: 60px; height: 60px; border-radius: 50%; background: #FFF8E6; border: 2px solid var(--amber); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 26px; }
[data-theme="dark"] .sprout-icon-shield { background: rgba(245,158,11,0.1); }
.sprout-headline { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
.sprout-description { font-size: 12px; color: var(--sub); line-height: 1.6; margin-bottom: 22px; }
.sprout-redirect-link { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); font-weight: 700; text-decoration: none; border-bottom: 1.5px dashed var(--primary); margin-top: 4px; font-size: 13px; }
.sprout-confirm-btn { width: 100%; padding: 13px; border-radius: 50px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,97,255,0.2); font-family: 'Poppins', sans-serif; transition: all 0.2s ease; }
.sprout-confirm-btn:hover { box-shadow: 0 8px 20px rgba(0,97,255,0.3); transform: translateY(-1px); }
.modal-roster-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--bg); border-radius: var(--r-xs); border-left: 3px solid var(--purple); margin-bottom: 7px; gap: 10px; }
.modal-roster-item.type-hdvl { border-left-color: var(--primary); }
.modal-roster-item.type-bl { border-left-color: var(--amber); }
.modal-member-name { font-size: 13px; font-weight: 600; color: var(--text); }
.modal-leave-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--sub); white-space: nowrap; }
.modal-action-delete-leave-trigger-btn { background: transparent; border: none; color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; border-radius: var(--r-xs); transition: all 0.15s ease; flex-shrink: 0; }
.modal-action-delete-leave-trigger-btn:hover { color: var(--red); background: rgba(239,68,68,0.08); }
.warning-icon-shield { width: 64px; height: 64px; border-radius: 50%; background: #FEE2E2; border: 2px solid var(--red); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; color: var(--red); }
[data-theme="dark"] .warning-icon-shield { background: rgba(239,68,68,0.14); }
.warning-modal-button-controls-row { display: flex; gap: 12px; width: 100%; margin-top: 22px; }
.warning-cancel-btn { flex: 1; padding: 13px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; font-family: 'Poppins', sans-serif; transition: border-color 0.15s ease; }
.warning-cancel-btn:hover { border-color: var(--silver); }
.warning-confirm-danger-btn { flex: 1; padding: 13px; border-radius: 50px; border: none; background: var(--red); color: white; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; font-family: 'Poppins', sans-serif; box-shadow: 0 4px 12px rgba(239,68,68,0.25); transition: all 0.15s ease; }
.warning-confirm-danger-btn:hover { box-shadow: 0 8px 18px rgba(239,68,68,0.35); transform: translateY(-1px); }
.toast-notification { position: fixed; bottom: -120px; right: 20px; left: 20px; background: var(--secondary); color: white; padding: 14px 20px; border-radius: var(--r-sm); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; z-index: 500; font-size: 12px; font-weight: 600; transition: bottom 0.4s cubic-bezier(0.175,0.885,0.32,1.275); border-left: 4px solid var(--primary); }
@media(min-width:480px){ .toast-notification { left: auto; right: 32px; min-width: 300px; } }
.toast-notification.active { bottom: 24px; }
@media(min-width:480px){ .toast-notification.active { bottom: 32px; } }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
@keyframes spinLoop { 0%{ transform: rotate(0deg); } 100%{ transform: rotate(360deg); } }

/* ─── RESPONSIVE MEDIA QUERIES ─── */
@media(max-width: 1100px) {
  .shell { grid-template-columns: 76px minmax(0,1fr) !important; }
  .logo-metadata-text, .sidebar-collapse-toggle-trigger, .nav-section-label { display: none !important; }
  .sidebar-top-branding-row { padding: 28px 16px 20px !important; justify-content: center !important; }
  .sidebar .nav-item span:last-child { display: none !important; }
  .sidebar .nav-item { justify-content: center; }
  .scroll-zone { padding: 24px 20px 40px !important; }
  .topbar-wrapper { padding: 0 20px; }
  .console-split-grid, .handoff-split-grid { grid-template-columns: 1fr !important; gap: 20px !important; }
  .unified-roster-box, .unified-demographics-box, .leader-card-box { min-height: auto !important; max-width: 100%; }

@media(max-width: 900px) {

@media(max-width: 480px) {

    width: calc(100% - 32px);

  }

  .tut-footer { padding: 10px 16px; }

}

/* ═══════════════════════════════════════════════
   INTERACTIVE TUTORIAL OVERLAY (SPOTLIGHT)
═══════════════════════════════════════════════ */
#tutorialOverlay { 
  position: fixed;
  inset: 0; 
  background: rgba(8,13,24,0.6); 
  backdrop-filter: none;
  z-index: 8000; display: none; opacity: 0; 
  transition: opacity 0.35s ease; 
  pointer-events: none;
}
#tutorialOverlay.active { display: block; opacity: 1; pointer-events: auto; }

.tutorial-highlight-element { 
  position: relative !important; z-index: 8001 !important; 
  border-radius: var(--r-xs);
  box-shadow: 0 0 0 3px var(--primary), 0 0 0 6px rgba(0,97,255,0.25), 0 16px 48px rgba(0,0,0,0.55) !important; 
  pointer-events: none; 
  transition: box-shadow 0.4s cubic-bezier(0.25,1,0.5,1);
  scroll-margin-top: 120px; 
  animation: tutPulse 2s ease-in-out infinite;
}
@keyframes tutPulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--primary), 0 0 0 6px rgba(0,97,255,0.25), 0 16px 48px rgba(0,0,0,0.55) !important; }
  50%       { box-shadow: 0 0 0 3px var(--primary), 0 0 0 10px rgba(0,97,255,0.15), 0 16px 48px rgba(0,0,0,0.55) !important; }
}
[data-theme="dark"] .tutorial-highlight-element { }

/* Tutorial Tooltip */
#tutorialTooltip { 
  position: fixed; 
  z-index: 8002; background: var(--card); border: 2px solid var(--primary); 
  padding: 0; border-radius: var(--r);
  box-shadow: var(--shadow-xl), 0 0 40px rgba(0,97,255,0.15); 
  width: calc(100% - 20px); max-width: 480px; display: none; opacity: 0; 
  transition: opacity 0.4s ease;
  overflow: hidden;
}
#tutorialTooltip.active { display: block; }

/* Tooltip header stripe */
.tut-header-stripe {
  background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
  padding: 14px 24px;
  display: flex; align-items: center;
  justify-content: space-between;
}
.tut-step-badge {
  background: rgba(255,255,255,0.2); color: white; font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px;
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.3);
}
.tut-step-dots { display: flex; gap: 5px; align-items: center; }
.tut-dot { 
  width: 7px;
  height: 7px; border-radius: 50%; background: rgba(255,255,255,0.3); 
  transition: all 0.3s ease; cursor: pointer;
}
.tut-dot.active { background: white; transform: scale(1.3); }
.tut-dot.done { background: rgba(255,255,255,0.7); }

/* Progress bar */
.tut-progress-bar-track {
  height: 3px; background: var(--border); width: 100%;
}
.tut-progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), #4A90FF);
  transition: width 0.4s cubic-bezier(0.25,1,0.5,1);
}

/* Tooltip body */
.tut-body { padding: 22px 24px 20px; }
.tut-title { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 8px; display:flex; align-items:center; gap:8px; }
.tut-desc { font-size: 13px; color: var(--sub); line-height: 1.65; margin-bottom: 0; }

/* Action hint chip */
.tut-action-hint {
  margin-top: 14px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--blue-25);
  border: 1px solid var(--blue-100); border-radius: var(--r-sm);
  padding: 8px 14px; font-size: 11px; font-weight: 700; color: var(--primary);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.tut-action-hint .material-icons-round { font-size: 14px; }
[data-theme="dark"] .tut-action-hint { background: rgba(0,97,255,0.1); border-color: rgba(0,97,255,0.3); }

/* Tooltip footer */
.tut-footer {
  padding: 14px 24px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg);
}
.tut-btn-skip { background: transparent; border: none; color: var(--sub); font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Poppins', sans-serif; display: flex; align-items: center; gap: 4px; transition: color 0.2s ease; }
.tut-btn-skip:hover { color: var(--red); }
.tut-btn-row { display: flex; gap: 10px; align-items: center; }
.tut-btn-prev { background: var(--bg); border: 1.5px solid var(--border); color: var(--sub); padding: 9px 18px; border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Poppins', sans-serif; transition: all 0.2s ease; display: flex; align-items: center; gap: 4px; }
.tut-btn-prev:hover { border-color: var(--primary); color: var(--primary); }
.tut-btn-next { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 10px 22px; border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 14px rgba(0,97,255,0.25); transition: all 0.2s; font-family: 'Poppins', sans-serif; display: flex; align-items: center; gap: 5px; }
.tut-btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,97,255,0.35); }
/* ═══════════════════════════════════════════════
   TASK ALLOCATION & DIRECTORY LAYOUT
═══════════════════════════════════════════════ */
/* Creates a 2-column layout that takes up exactly the rest of your screen height */
.allocation-split-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr; /* Chart gets slightly more space than the list */
  gap: 20px;
  align-items: stretch;
  height: calc(100vh - 230px); /* Locks the view to the exact window height */
}

/* Modifies the standard roster box to stretch fully */
.allocation-chart-card, .allocation-directory-card {
  min-height: 0 !important; /* Overrides the default 480px */
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 24px;
}

/* Enables sleek internal scrolling on the right side */
.trained-agents-scroll-zone {
  flex: 1;
  overflow-y: auto;
  padding-right: 8px;
}
.trained-agents-scroll-zone::-webkit-scrollbar { width: 4px; }
.trained-agents-scroll-zone::-webkit-scrollbar-track { background: transparent; }
.trained-agents-scroll-zone::-webkit-scrollbar-thumb { background: var(--border); border-radius: 50px; }

/* Tightly packs the agent cards so no space is wasted */
.trained-agents-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
  gap: 12px; 
  padding-bottom: 10px;
}

.project-agent-card { 
  background: var(--card); border: 1.5px solid var(--border); 
  border-radius: var(--r-sm); padding: 12px; box-shadow: var(--shadow-sm); 
  transition: transform 0.2s ease, box-shadow 0.2s ease; 
}
.project-agent-card:hover { 
  transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); 
}
.pac-title { 
  font-size: 11px; font-weight: 800; color: var(--secondary); text-transform: uppercase; 
  letter-spacing: 0.5px; margin-bottom: 10px; border-bottom: 1px dashed var(--border); 
  padding-bottom: 8px; line-height: 1.3;
}
[data-theme="dark"] .pac-title { color: var(--text); }
.pac-agents-wrapper { display: flex; flex-wrap: wrap; gap: 6px; }

/* Denser Agent Pills */
.agent-tag { 
  background: var(--blue-25); color: var(--primary); font-size: 10px; font-weight: 600; 
  padding: 4px 10px; border-radius: 50px; border: 1px solid var(--blue-100); 
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
[data-theme="dark"] .agent-tag { background: rgba(0,97,255,0.1); border-color: rgba(0,97,255,0.3); }

/* Responsive adjustments for smaller screens */
@media(max-width: 1100px) {
  .allocation-split-grid { 
    grid-template-columns: 1fr; /* Stacks them back on top of each other on smaller screens */
    height: auto; 
  }
  .allocation-chart-card, .allocation-directory-card { height: 450px; }
}
/* Custom Red Styling for the Logout Button */
.topbar-action-icon-btn.logout-btn { 
  color: var(--red); 
  border-color: rgba(239, 68, 68, 0.3); 
}
.topbar-action-icon-btn.logout-btn:hover { 
  background: rgba(239, 68, 68, 0.1); 
  border-color: var(--red); 
  color: var(--red); 
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15); 
}
/* Allocation Day Filter Buttons */
.allocation-filter-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.day-filter-btn {
  background: var(--card); border: 1.5px solid var(--border); color: var(--sub);
  padding: 10px 18px; border-radius: 50px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
  transition: all 0.2s ease; font-family: 'Poppins', sans-serif;
  box-shadow: var(--shadow-sm);
}
.day-filter-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
.day-filter-btn.active {
  background: var(--primary); color: white; border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(0,97,255,0.25);
}
[data-theme="dark"] .day-filter-btn { background: var(--card); }
[data-theme="dark"] .day-filter-btn.active { background: var(--primary); }
/* --- START SOP LIBRARY INTEGRATION --- */
#sop-module-wrapper {
  display: flex; flex-direction: column; height: calc(100vh - 120px); position: relative;
  overflow: hidden; background: var(--card); border-radius: var(--r);
  border: 1.5px solid var(--border); box-shadow: var(--shadow-sm);
}

.sop-header {
  display: flex; justify-content: space-between; align-items: center; padding: 24px 32px;
  background: var(--card); border-bottom: 1px solid var(--border);
}
.sop-header h2 { font-size: 20px; font-weight: 800; color: var(--secondary); margin:0;}
[data-theme="dark"] .sop-header h2 { color: var(--text); }

/* Update Header layout for Search, Sort & Toggle */
.sop-actions { display: flex; align-items: center; gap: 16px; }

.sop-search-container {
  display: flex; align-items: center; background: var(--bg); border-radius: 50px;
  padding: 8px 18px; width: 320px; border: 1.5px solid var(--border); transition: border-color 0.2s ease;
}
.sop-search-container:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.sop-search-container span { color: var(--primary); font-size: 20px;}
.sop-search-container input {
  border: none; background: transparent; outline: none; margin-left: 10px; width: 100%;
  color: var(--text); font-size: 13px; font-family: 'Poppins', sans-serif;
}

.sop-sort-container {
  display: flex; align-items: center; background: var(--bg); border-radius: 50px;
  padding: 8px 16px; border: 1.5px solid var(--border); transition: border-color 0.2s ease;
}
.sop-sort-container:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.sop-sort-container .sort-icon { color: var(--primary); font-size: 18px; margin-right: 6px; }
.sop-sort-container select {
  border: none; background: transparent; outline: none; color: var(--text);
  font-size: 13px; font-family: 'Poppins', sans-serif; cursor: pointer;
}

/* VIEW TOGGLE BUTTONS */
.sop-view-toggle {
  display: flex; background: var(--bg); border-radius: 8px; 
  border: 1.5px solid var(--border); overflow: hidden;
}
.view-btn {
  background: transparent; border: none; padding: 6px 12px; cursor: pointer; 
  color: var(--sub); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
}
.view-btn:hover { background: rgba(0,0,0,0.05); }
.view-btn.active { background: #E5EFFF; color: var(--primary); }
[data-theme="dark"] .view-btn:hover { background: rgba(255,255,255,0.05); }
[data-theme="dark"] .view-btn.active { background: rgba(0,97,255,0.2); color: var(--primary); }

.sop-workspace { flex: 1; overflow-y: auto; padding: 24px 32px; background: var(--bg); }
.sop-workspace::-webkit-scrollbar { width: 4px; }
.sop-workspace::-webkit-scrollbar-thumb { background: var(--border); border-radius: 50px; }

/* SOP LIST & CARDS */
.sop-list { display: flex; flex-direction: column; }
.sop-card {
  background: var(--card); padding: 18px; border-radius: var(--r-sm); margin-bottom: 12px;
  border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer; 
  transition: all 0.2s cubic-bezier(0.25,1,0.5,1); display: flex; align-items: center;
}
.sop-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
[data-theme="dark"] .sop-card h4 { color: var(--text) !important;}

.sop-doc-icon {
  width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  color: white; margin-right: 18px; flex-shrink: 0; box-shadow: var(--shadow-sm);
}

/* GRID VIEW DYNAMICS */
.sop-list.grid-view {
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
  gap: 16px;
}
.sop-list.grid-view .sop-card {
  flex-direction: column; text-align: center; justify-content: center; 
  padding: 30px 20px; margin-bottom: 0;
}
.sop-list.grid-view .sop-doc-icon {
  margin-right: 0; margin-bottom: 16px; width: 56px; height: 56px;
}
.sop-list.grid-view .sop-doc-icon .material-icons-round {
  font-size: 28px !important;
}

/* MODERN SLIDE-OUT DRAWER (RESIZABLE) */
.sop-drawer {
  position: absolute; top: 0; right: 0; 
  transform: translateX(110%); 
  width: 700px; min-width: 500px; height: 100%; 
  background: #FFFFFF; box-shadow: -10px 0 30px rgba(0,0,0,0.15);
  transition: transform 0.4s cubic-bezier(0.25,1,0.5,1); 
  display: flex; flex-direction: column; 
  z-index: 100; border-left: 1px solid var(--border);
}
.sop-drawer.open { 
  transform: translateX(0); 
}
[data-theme="dark"] .sop-drawer { background: var(--card); }

/* RESIZER HANDLE */
.drawer-resizer {
  position: absolute; left: -3px; top: 0; bottom: 0; width: 10px; cursor: ew-resize;
  background: transparent; z-index: 200; display: flex; align-items: center; justify-content: center;
}
.resizer-grip {
  width: 4px; height: 40px; background: #C3C3C3; border-radius: 4px; transition: background 0.2s;
  box-shadow: 1px 0 3px rgba(0,0,0,0.1);
}
.drawer-resizer:hover .resizer-grip, .drawer-resizer:active .resizer-grip { background: var(--primary); }

.drawer-header-modern {
  padding: 20px 24px; display: flex; justify-content: space-between; align-items: center;
}
.drawer-title-group { display: flex; align-items: center; gap: 14px; }
.doc-icon-wrapper {
  width: 36px; height: 36px; background: #E5EFFF; color: #0061FF; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.drawer-header-modern h3 { font-size: 18px; font-weight: 700; color: #0A1B5F; margin: 0; }
[data-theme="dark"] .drawer-header-modern h3 { color: var(--text); }
.modern-close-btn {
  background: transparent; border: 1.5px solid var(--border); border-radius: 6px; width: 32px; height: 32px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--sub); transition: 0.2s;
}
.modern-close-btn:hover { background: #F9F9F9; color: var(--asphalt); border-color: var(--silver); }

.drawer-meta-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border); background: #FCFCFC;
}
[data-theme="dark"] .drawer-meta-grid { background: var(--bg); }
.meta-col { padding: 16px 24px; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
.meta-col:last-child { border-right: none; }
.meta-label { font-size: 9px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.meta-value { font-size: 13px; font-weight: 600; color: #0A1B5F; }
[data-theme="dark"] .meta-value { color: var(--text); }

.author-val { display: flex; align-items: center; gap: 8px; }
.meta-avatar { width: 22px; height: 22px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

.pro-tip-banner {
  margin: 16px 24px 0; background: #F5F9FF; border: 1px solid #CCE0FF; border-radius: 6px; padding: 12px 16px;
  display: flex; align-items: center; gap: 10px; font-size: 12px; color: #0A1B5F;
}
[data-theme="dark"] .pro-tip-banner { background: rgba(0,97,255,0.1); color: var(--text); border-color: rgba(0,97,255,0.2); }

.drawer-content { flex: 1; padding: 16px 24px 24px; background: #FFFFFF; display: flex; flex-direction: column; }
[data-theme="dark"] .drawer-content { background: var(--card); }
.doc-preview-frame { flex: 1; border: 1px solid var(--border); border-radius: var(--r-sm); width: 100%; box-shadow: inset 0 2px 8px rgba(0,0,0,0.02); }

.drawer-footer-modern {
  padding: 16px 24px; border-top: 1px solid var(--border); background: #F9F9F9;
  display: flex; justify-content: space-between; align-items: center;
}
[data-theme="dark"] .drawer-footer-modern { background: var(--bg); }
.btn-open-docs {
  background: #0061FF; color: white; text-decoration: none; font-size: 13px; font-weight: 600;
  padding: 10px 20px; border-radius: 6px; transition: 0.2s; border: none; box-shadow: 0 2px 6px rgba(0,97,255,0.2);
}
.btn-open-docs:hover { background: #0052D6; box-shadow: 0 4px 12px rgba(0,97,255,0.3); transform: translateY(-1px); }
.btn-close-outline {
  background: white; border: 1.5px solid var(--border); color: #0A1B5F; padding: 9px 24px;
  border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
}
.btn-close-outline:hover { border-color: #0A1B5F; }
[data-theme="dark"] .btn-close-outline { background: var(--card); color: var(--text); }
[data-theme="dark"] .btn-close-outline:hover { border-color: var(--text); }

/* RESIZER HANDLE FOR DRAWERS */
#kpiDrawerResizer.drawer-resizer {
  position: absolute; 
  left: -5px; 
  top: 0; 
  bottom: 0; 
  width: 10px; 
  cursor: ew-resize;
  background: transparent; 
  z-index: 200; 
  display: flex; 
  align-items: center; 
  justify-content: center;
}

#kpiDrawerResizer:hover .resizer-grip, 
#kpiDrawerResizer:active .resizer-grip { 
  background: var(--primary); 
}
/* --- END SOP LIBRARY INTEGRATION --- */
/* --- ACCORDION COMPONENT & UNIFORM CARD STYLING --- */
.accordion-project-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  flex-direction: column;
}

.accordion-project-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}

.accordion-header {
  width: 100%;
  min-height: 54px; /* Ensures all unopened cards have uniform height */
