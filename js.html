// --- TASK ALLOCATION CHART & AGENT DIRECTORY LOGIC ---
let allocationChartInstance = null;
let globalAllocationData = {};
let currentAllocationDay = 'Monday';

function switchAllocationDay(dayStr) {
  currentAllocationDay = dayStr;
  document.querySelectorAll('.day-filter-btn').forEach(btn => {
    if(btn.innerText.trim().toLowerCase() === dayStr.toLowerCase()) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  drawAllocationChartInstance();
}

function drawAllocationChartInstance() {
  const canvas = document.getElementById('allocationChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  if (allocationChartInstance) allocationChartInstance.destroy();

  const dayData = globalAllocationData[currentAllocationDay] || [];
  
  const labels = dayData.map(d => d.name);
  const totalHours = dayData.map(d => d.hours);
  
  const baseHours = totalHours.map(h => Math.min(h, 7.5));
  const overHours = totalHours.map(h => Math.max(0, h - 7.5));

  allocationChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'Within Shift', data: baseHours, backgroundColor: '#10B981', barThickness: 24 },
        { label: 'Over Limit', data: overHours, backgroundColor: '#EF4444', barThickness: 24 }
      ]
    },
    options: {
      indexAxis: 'y', 
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'y', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: function(tooltipItem) { return tooltipItem.datasetIndex === 0; },
          callbacks: { 
            label: (ctx) => {
              const total = totalHours[ctx.dataIndex];
              return `Total Time: ${total} Hours`;
            }
          } 
        },
        annotation: {
          annotations: {
            shiftLimitLine: {
              type: 'line', xMin: 7.5, xMax: 7.5,
              borderColor: '#0A1B5F', borderWidth: 2, borderDash: [5, 5],
              label: {
                display: true, content: 'Shift Limit (7.5 hrs)', position: 'start',
                backgroundColor: '#0A1B5F', color: '#fff', font: { size: 10, family: 'Poppins' }
              }
            }
          }
        }
      },
      scales: {
        x: { stacked: true, beginAtZero: true, max: Math.max(...totalHours, 12) + 1, grid: { color: '#E5EFFF' } },
        y: { stacked: true, grid: { display: false }, ticks: { font: { family: 'Poppins', size: 12, weight: '600' }, color: '#0A1B5F' } }
      }
    }
  });
}

function renderTaskAllocationChart() {
  showToastNotification("Fetching capacity and directory metrics...");
  
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success) {
        handleSystemError("Allocation Data Fetch Failed", res.message);
        return;
      }
      
      try {
        globalAllocationData = res.chartData;
        drawAllocationChartInstance();

        const agentsGrid = document.getElementById('trainedAgentsGridUI');
        if (agentsGrid) {
          agentsGrid.innerHTML = '';
          for (const [project, agents] of Object.entries(res.trainedAgents || {})) {
            let agentsHTML = agents.map(a => `<div class="agent-tag"><span class="material-icons-round" style="font-size:14px;">person</span> ${a}</div>`).join('');
            agentsGrid.innerHTML += `
              <div class="project-agent-card">
                <div class="pac-title">${project}</div>
                <div class="pac-agents-wrapper">${agentsHTML}</div>
              </div>
            `;
          }
        }
        showToastNotification("Metrics and Directory loaded.");
      } catch(err) {
        handleSystemError("Chart Render Error", err.message);
      }
    })
    .withFailureHandler(err => handleSystemError("Chart Engine Connection Error", err.message))
    .getTaskAllocationData();
}

let currentTutStep = 0;

function launchTourFromHub() {
  triggerTitleAnchorRoute('tracker');
  setTimeout(() => {
    startTutorial();
  }, 150);
}

function startTutorial() {
  currentTutStep = 0;
  document.getElementById('tutorialOverlay').classList.add('active');
  document.getElementById('tutorialTooltip').classList.add('active');
  renderTutorialStep();
}

function endTutorial() {
  document.getElementById('tutorialOverlay').classList.remove('active');
  document.getElementById('tutorialTooltip').classList.remove('active');
  clearTutorialHighlight();
  switchActiveWorkspaceView('tracker');
}

function clearTutorialHighlight() {
  document.querySelectorAll('.tutorial-highlight-element').forEach(el => {
    el.classList.remove('tutorial-highlight-element');
  });
}

function buildStepDots() {
  const dotsEl = document.getElementById('tutStepDots');
  if (!dotsEl) return;
  dotsEl.innerHTML = '';
  tutorialSteps.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'tut-dot' + (i === currentTutStep ? ' active' : (i < currentTutStep ? ' done' : ''));
    dotsEl.appendChild(dot);
  });
}

function renderTutorialStep() {
  clearTutorialHighlight();
  const step = tutorialSteps[currentTutStep];
  const total = tutorialSteps.length;
  const tooltip = document.getElementById('tutorialTooltip');

  if (step.setup) step.setup();
  tooltip.style.opacity = '0';
  setTimeout(() => {
    document.getElementById('tutTitleText').innerText = step.title;
    document.getElementById('tutDescText').innerText = step.desc;
    document.getElementById('tutProgressText').innerText = `STEP ${currentTutStep + 1} OF ${total}`;

    const pct = Math.round(((currentTutStep + 1) / total) * 100);
    const bar = document.getElementById('tutProgressBar');
    if (bar) bar.style.width = pct + '%';

    buildStepDots();

    const hintEl = document.getElementById('tutActionHint');
    if (hintEl) {
      if (step.hint) {
        hintEl.innerHTML = `<div class="tut-action-hint"><span class="material-icons-round">${step.hint.icon}</span>${step.hint.text}</div>`;
      } else {
        hintEl.innerHTML = '';
      }
    }

    const nextBtn = document.getElementById('tutNextBtn');
    if (nextBtn) {
      if (currentTutStep === total - 1) {
        nextBtn.innerHTML = `Finish <span class="material-icons-round" style="font-size:14px;">check_circle</span>`;
      } else {
        nextBtn.innerHTML = `Next <span class="material-icons-round" style="font-size:14px;">arrow_forward</span>`;
      }
    }

    const prevBtn = document.getElementById('tutPrevBtn');
    if (prevBtn) {
      prevBtn.style.display = currentTutStep === 0 ? 'none' : 'flex';
    }

    if (step.targetId) {
      const target = document.getElementById(step.targetId);
      if (target) {
        target.classList.add('tutorial-highlight-element');
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => {
          const rect = target.getBoundingClientRect();
          const tooltipWidth = tooltip.offsetWidth;
          const tooltipHeight = tooltip.offsetHeight;
          
          let top, left;

          const spaceBelow = window.innerHeight - rect.bottom;
          const spaceAbove = rect.top;
          const spaceLeft = rect.left;
          const spaceRight = window.innerWidth - rect.right;

          left = rect.left + (rect.width / 2) - (tooltipWidth / 2);

          let effectiveHint = step.positionHint;
          if (window.innerWidth < 768) {
            effectiveHint = 'top-bottom-fallback';
          }

          if (effectiveHint === 'right' && spaceRight >= tooltipWidth + 30) {
            left = rect.right + 20;
            top = rect.top + (rect.height / 2) - (tooltipHeight / 2);
          } else if (effectiveHint === 'left' && spaceLeft >= tooltipWidth + 30) {
            left = rect.left - tooltipWidth - 20;
            top = rect.top + (rect.height / 2) - (tooltipHeight / 2);
          } else {
            if (spaceBelow >= tooltipHeight + 30) {
              top = rect.bottom + 20;
            } else if (spaceAbove >= tooltipHeight + 30) {
              top = rect.top - tooltipHeight - 20;
            } else {
              top = Math.max(20, (window.innerHeight - tooltipHeight) / 2);
            }
          }

          if (effectiveHint !== 'right' && effectiveHint !== 'left') {
            if (left < 10) left = 10;
            if (left + tooltipWidth > window.innerWidth - 10) {
              left = window.innerWidth - tooltipWidth - 10;
            }
          }

          if (effectiveHint === 'left' || effectiveHint === 'right') {
            if (top < 10) top = 10;
            if (top + tooltipHeight > window.innerHeight - 10) {
              top = window.innerHeight - tooltipHeight - 10;
            }
          }

          tooltip.style.top = `${top}px`;
          tooltip.style.left = `${left}px`;
          tooltip.style.bottom = 'auto';
          tooltip.style.transform = 'none';
          tooltip.style.opacity = '1';
        }, 450);
      }
    } else {
      tooltip.style.top = '50%';
      tooltip.style.left = '50%';
      tooltip.style.bottom = 'auto';
      tooltip.style.transform = 'translate(-50%, -50%)';
      tooltip.style.opacity = '1';
    }
  }, 200);
}

function nextTutorialStep() {
  if (currentTutStep < tutorialSteps.length - 1) {
    currentTutStep++;
    renderTutorialStep();
  } else {
    endTutorial();
  }
}

function prevTutorialStep() {
  if (currentTutStep > 0) {
    currentTutStep--;
    renderTutorialStep();
  }
}

// --- IDLE SESSION MANAGER ---
let idleTimeInterval;
const MAX_IDLE_TIME = 5 * 60 * 60 * 1000;

function resetIdleTimer() {
  clearTimeout(idleTimeInterval);
  idleTimeInterval = setTimeout(executeAutoLogout, MAX_IDLE_TIME);
}

function initIdleListeners() {
  window.onload = resetIdleTimer;
  window.onmousemove = resetIdleTimer;
  window.onmousedown = resetIdleTimer;
  window.ontouchstart = resetIdleTimer;
  window.onclick = resetIdleTimer;
  window.onkeypress = resetIdleTimer;
  window.addEventListener('scroll', resetIdleTimer, true);
  resetIdleTimer();
}

function executeAutoLogout() {
  localStorage.removeItem('pexHubAuthTime');
  document.getElementById('mainContent').classList.remove('reveal');
  document.getElementById('titlePage').classList.add('out');
  document.getElementById('loginPage').classList.remove('out');
  document.getElementById('loginPage').classList.add('active');
  
  document.getElementById('loginErrorContext').innerText = "Session expired due to inactivity. Please authenticate again.";
  document.getElementById('loginErrorContext').style.color = "var(--sub)";
  document.getElementById('executeLoginBtnUI').innerHTML = `<span class="material-icons-round" style="font-size:18px;">lock_open</span> Authenticate Workspace`;
  document.getElementById('executeLoginBtnUI').disabled = false;
  
  teamRegistry = []; monthlyLeavesCache = {}; demographicsCache = {}; window.currentResourceLeaveBlocks = [];
  
  if (typeof google !== 'undefined' && google.script) {
    google.script.run.logUserSessionTelemetry("SYSTEM LOGOUT: Session expired after 5 hours of inactivity");
  }
}

function executeManualLogout() {
  localStorage.removeItem('pexHubAuthTime');
  document.getElementById('mainContent').classList.remove('reveal');
  document.getElementById('titlePage').classList.add('out');
  document.getElementById('loginPage').classList.remove('out');
  document.getElementById('loginPage').classList.add('active');
  
  const errorNode = document.getElementById('loginErrorContext');
  errorNode.innerText = "You have securely logged out.";
  errorNode.style.color = "var(--green)";
  const loginBtn = document.getElementById('executeLoginBtnUI');
  loginBtn.innerHTML = `<span class="material-icons-round" style="font-size:18px;">lock_open</span> Authenticate Workspace`;
  loginBtn.disabled = false;
  
  teamRegistry = []; monthlyLeavesCache = {}; demographicsCache = {}; window.currentResourceLeaveBlocks = [];
  
  if (typeof google !== 'undefined' && google.script) {
    google.script.run.logUserSessionTelemetry("SYSTEM LOGOUT: User executed manual logout.");
  }
}

function initiateCorporateLogin() {
  const btn = document.getElementById('executeLoginBtnUI');
  const errorNode = document.getElementById('loginErrorContext');
  
  btn.innerHTML = `<span class="material-icons-round spinning-icon" style="font-size:18px;">sync</span> Authenticating...`;
  btn.disabled = true;
  errorNode.innerText = "";
  
  google.script.run
    .withSuccessHandler(res => {
      if (res.authorized) {
        localStorage.setItem('pexHubAuthTime', Date.now().toString());
        
        document.getElementById('loginPage').classList.remove('active');
        document.getElementById('loginPage').classList.add('out');
        
        document.getElementById('titlePage').classList.remove('out');
        setTimeout(() => document.getElementById('brandLogo').classList.add('loaded'), 150);
        setTimeout(() => document.getElementById('introEyebrow').classList.add('loaded'), 350);
        setTimeout(() => document.querySelector('.splash-title').classList.add('loaded'), 500);
        setTimeout(() => document.getElementById('introSub').classList.add('loaded'), 700);
        setTimeout(() => document.getElementById('titleMenuControls').classList.add('loaded'), 900);
        setTimeout(() => {
          const ind = document.getElementById('scrollIndicator');
          if(ind) ind.classList.add('loaded');
        }, 1200);
        
        initIdleListeners();
        loadSpreadsheetData();
      } else {
        btn.innerHTML = `<span class="material-icons-round" style="font-size:18px;">gpp_bad</span> Access Restricted`;
        errorNode.innerText = "Unauthorized Domain Blocked: " + res.emailAttempt;
        errorNode.style.color = "var(--red)";
      }
    })
    .withFailureHandler(err => {
      btn.innerHTML = `<span class="material-icons-round" style="font-size:18px;">lock_open</span> Try Again`;
      btn.disabled = false;
      errorNode.innerText = `Server Error: ${err.message}`;
    })
    .authenticateUser();
}

function switchActiveWorkspaceView(targetView) {
  const btnTracker    = document.getElementById('menuBtnTracker');
  const btnDemo       = document.getElementById('menuBtnDemo');
  const btnHandoff    = document.getElementById('menuBtnHandoff');
  const btnSources    = document.getElementById('menuBtnSources');
  const btnAllocation = document.getElementById('menuBtnAllocation');
  const btnSOP        = document.getElementById('menuBtnSOP');
  const btnKPI        = document.getElementById('menuBtnKPI'); 

  const panelTracker    = document.getElementById('panelViewTracker');
  const panelDemo       = document.getElementById('panelViewDemo');
  const panelHandoff    = document.getElementById('panelViewHandoff');
  const panelSources    = document.getElementById('panelViewSources');
  const panelAllocation = document.getElementById('panelViewAllocation');
  const panelSOP        = document.getElementById('panelViewSOP');
  const panelKPI        = document.getElementById('panelViewKPI'); 

  const headerTitle  = document.getElementById('workspaceHeaderTitle');

  [btnTracker, btnDemo, btnHandoff, btnSources, btnAllocation, btnSOP, btnKPI].forEach(b => { if(b) b.classList.remove('active'); });
  [panelTracker, panelDemo, panelHandoff, panelSources, panelAllocation, panelSOP, panelKPI].forEach(p => { if(p) p.classList.remove('active-view'); });

  document.getElementById('mainKpiStrip').style.display = (['handoff','sources','allocation','sop','kpi'].includes(targetView)) ? 'none' : 'grid';

  requestAnimationFrame(() => {
    if (targetView === 'tracker') {
      if(btnTracker) btnTracker.classList.add('active');
      if(panelTracker) panelTracker.classList.add('active-view');
      headerTitle.innerText = "Attendance & VL";
    } else if (targetView === 'handoff') {
      if(btnHandoff) btnHandoff.classList.add('active');
      if(panelHandoff) panelHandoff.classList.add('active-view');
      headerTitle.innerText = "Project Handoffs";
      if (typeof teamRegistry !== 'undefined' && teamRegistry && teamRegistry.length > 0) populateHandoffDropdowns();
    } else if (targetView === 'sources') {
      if(btnSources) btnSources.classList.add('active');
      if(panelSources) panelSources.classList.add('active-view');
      headerTitle.innerText = "Sources & Suggestions";
    } else if (targetView === 'allocation') {
      if(btnAllocation) btnAllocation.classList.add('active');
      if(panelAllocation) panelAllocation.classList.add('active-view');
      headerTitle.innerText = "Task Allocation";
      renderTaskAllocationChart();
    } else if (targetView === 'sop') {
      if(btnSOP) btnSOP.classList.add('active');
      if(panelSOP) panelSOP.classList.add('active-view');
      headerTitle.innerText = "SOP Library";
      loadSOPLibrary();
    } else if (targetView === 'kpi') {
      if(btnKPI) btnKPI.classList.add('active');
      if(panelKPI) panelKPI.classList.add('active-view');
      headerTitle.innerText = "KPI Process";
      loadKPILibrary();

// Title Cleaner Helper (Strips extensions, prefixes like 'pex-', hyphens, and underscores)
function cleanKPITitle(title) {
  if (!title) return "";
  let clean = title.replace(/\.[^/.]+$/, ""); // Remove extension (.pdf, .docx, etc)
  clean = clean.replace(/^(?:pex|kpi|sop|vlc|draft)[_\-\s]*/i, ""); // Remove prefixes
  clean = clean.replace(/[_\-]+/g, " "); // Replace hyphens/underscores with spaces
  return clean.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()).trim();
}

function renderAttendanceDashboard(data) {
  if (data.authorized === false) {
     document.getElementById('accessDeniedOverlay').classList.add('active');
     document.getElementById('deniedEmailContext').innerText = "Attempted Login: " + data.emailAttempt;
     return;
  }

  document.getElementById('currentDate').innerText = data.dateString;
  const startDateInput = document.getElementById('formLeaveStartDateInput');
if (startDateInput && !startDateInput.value) startDateInput.value = data.inputDefaultDate;

  teamRegistry          = data.roster;
  monthlyLeavesCache    = data.calendarLeaveMap;
  demographicsCache     = data.demographicsMap;
  currentTrackingDateStr = data.targetDayStr;
  cachedMonthNum        = data.currentMonthNum;
  cachedYear            = data.currentYear;
  document.getElementById('rosterBoxHeaderTitle').innerText = `Team Members Attendance Track (${currentTrackingDateStr})`;

  const teamRosterContainer     = document.getElementById('teamRosterContainer');
  const formEmployeeSelect      = document.getElementById('formEmployeeSelect');
  const demographicsGridContainer = document.getElementById('demographicsGridContainer');

  teamRosterContainer.innerHTML = '';
  demographicsGridContainer.innerHTML = '';
  formEmployeeSelect.innerHTML = '<option value="" disabled selected>Select Name</option>';

  let presentCount = 0; let leaveCount = 0;
  teamRegistry.forEach(member => {
    const rawStatus = member.rawStatus.trim();
    const code = rawStatus.toUpperCase();
    
    const optionNode = document.createElement('option');
    optionNode.value = member.rowIndex; 
    optionNode.innerText = member.name;
    formEmployeeSelect.appendChild(optionNode);

    if (code === 'P' || code === 'H') presentCount++;
    if (['OFF','VL','BL','SL'].includes(code) || code.includes('HD') || code.includes('HALF')) leaveCount++;

    const rowItem = document.createElement('div');
    rowItem.className = 'roster-row-item';
    rowItem.id = `roster-row-${member.rowIndex}`;

    const isAutomatedLeave = code.startsWith('VL') || code.includes('HD') || code.includes('HALF') || code.startsWith('BL');
    let controlLayoutBlock = '';

    if (isAutomatedLeave) {
      let badgeClass = 'lock-vl'; 
      let descriptiveText = rawStatus; // Displays 'HDVL 1st half' or 'HD VL 2nd half' directly
      
      if (code.includes('HD') || code.includes('HALF')) { 
        badgeClass = 'lock-hdvl'; 
      } else if (code.startsWith('BL')) { 
        badgeClass = 'lock-bl';   
        descriptiveText = 'BL'; 
      }
      controlLayoutBlock = `<div class="automated-leave-lock ${badgeClass}">🔒 Filed: ${descriptiveText}</div>`;
    } else {
      controlLayoutBlock = `
        <div class="card-action-controls-right">
          <button class="action-pill b-off ${code==='OFF'?'active':''}" onclick="commitStatusChange(this,'${member.name}',${member.rowIndex},'OFF')">OFF</button>
          <button class="action-pill b-sl ${code==='SL'?'active':''}"  onclick="commitStatusChange(this,'${member.name}',${member.rowIndex},'SL')">SL</button>
          <button class="action-pill b-p ${code==='P'?'active':''}"    onclick="commitStatusChange(this,'${member.name}',${member.rowIndex},'P')">P</button>
          <button class="action-pill b-abs ${code==='ABS'?'active':''}" onclick="commitStatusChange(this,'${member.name}',${member.rowIndex},'ABS')">ABS</button>
          <button class="action-pill b-h ${code==='H'?'active':''}"    onclick="commitStatusChange(this,'${member.name}',${member.rowIndex},'H')">H</button>
        </div>`;
    }

    const initials = member.initials || member.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
    rowItem.innerHTML = `
      <div class="member-profile-left">
        <div class="roster-avatar">${initials}</div>
        <div class="member-name">${member.name}</div>
      </div>

    const orgNode = document.createElement('div');
    orgNode.className = 'org-member-node';

      <div class="member-avatar">${initials}</div>
      <div class="member-name">${firstName}<br>${lastName}</div>

  document.getElementById('leaveCountCard').innerText     = leaveCount;
  document.getElementById('leaveBarCard').style.width     = (totalRosterCount > 0 ? Math.round((leaveCount/totalRosterCount)*100) : 0) + "%";

  }

function buildVisualCalendarModule() {
  const gridBody   = document.getElementById('calendarGridBody');
  const monthLabel = document.getElementById('calendarMonthLabel');
  gridBody.innerHTML = '';
  const shorthandMonths = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  monthLabel.innerText = `${["January","February","March","April","May","June","Jul","August","September","October","November","December"][cachedMonthNum]} ${cachedYear}`;

  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(name => {
    const label = document.createElement('div');
    label.className = 'calendar-day-label'; label.innerText = name;
    gridBody.appendChild(label);
  });
  const firstDayIndex     = new Date(cachedYear, cachedMonthNum, 1).getDay();
  const totalDaysInMonth  = new Date(cachedYear, cachedMonthNum + 1, 0).getDate();
  for (let s = 0; s < firstDayIndex; s++) gridBody.appendChild(document.createElement('div'));
  for (let day = 1; day <= totalDaysInMonth; day++) {
    const cell = document.createElement('div');
    cell.className = 'calendar-cell';
    const dayNumberNode = document.createElement('span');
    dayNumberNode.className = 'day-number'; dayNumberNode.innerText = day;
    cell.appendChild(dayNumberNode);

    if ([0,6].includes(new Date(cachedYear, cachedMonthNum, day).getDay())) cell.classList.add('weekend-rest-day');
    const currentIterationDayToken = day + "-" + shorthandMonths[cachedMonthNum];
    const dayActiveLeavesArray = monthlyLeavesCache[currentIterationDayToken];
    if (dayActiveLeavesArray && dayActiveLeavesArray.length > 0) {
      cell.classList.add('has-active-leaves');
      const dotTrack = document.createElement('div');
      dotTrack.className = 'leave-indicator-dot-track';
      dayActiveLeavesArray.forEach(leaveInfo => {
        const dot = document.createElement('div');
        dot.className = 'leave-micro-dot';
        const typeUpper = leaveInfo.type.toUpperCase();
        if (typeUpper.includes('HD') || typeUpper.includes('HALF')) dot.classList.add('type-hdvl');
        else if (typeUpper.startsWith('BL')) dot.classList.add('type-bl');
        dotTrack.appendChild(dot);
      });
      cell.appendChild(dotTrack);
      cell.onclick = () => triggerCalendarModalView(currentIterationDayToken, dayActiveLeavesArray);
    }
    gridBody.appendChild(cell);
  }
}

function getUserLeaveBlocks(name) {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const leaveDates = [];
  for (const [dayToken, leaves] of Object.entries(monthlyLeavesCache)) {
    if (leaves.some(l => l.name === name)) {
      const parts = dayToken.split('-');
      const day = parseInt(parts[0], 10);
      const monthIdx = months.findIndex(m => m.toLowerCase() === parts[1].toLowerCase());
      const d = new Date(cachedYear, monthIdx, day);
      leaveDates.push(d);
    }
  }
  leaveDates.sort((a,b) => a - b);
  if (leaveDates.length === 0) return [];

  const blocks = [];
  let currentBlock = [leaveDates[0]];
  
  for (let i = 1; i < leaveDates.length; i++) {
    const prev = currentBlock[currentBlock.length - 1];
    const curr = leaveDates[i];
    
    let allOff = true;
    let tempDate = new Date(prev);
    tempDate.setDate(tempDate.getDate() + 1);
    tempDate.setHours(0,0,0,0);
    const targetCurr = new Date(curr);
    targetCurr.setHours(0,0,0,0);
    
    while (tempDate < targetCurr) {
      if (tempDate.getDay() !== 0 && tempDate.getDay() !== 6) {
        allOff = false;
        break;
      }
      tempDate.setDate(tempDate.getDate() + 1);
    }

    if (allOff) {
      currentBlock.push(curr);
    } else {
      blocks.push(currentBlock);
      currentBlock = [curr];
    }
  }
  blocks.push(currentBlock);
  return blocks;
}

function renderUpcomingLeavesChips(name) {
   const container = document.getElementById('suggestedLeavesContainer');
   if(!name) { container.innerHTML = ''; return; }

   const blocks = getUserLeaveBlocks(name);

     container.innerHTML = '<div style="font-size:10px; color:var(--sub); margin-top:8px; font-style:italic;">No upcoming leaves detected in tracking database.</div>';
     return;
   }

   let html = '<div class="suggested-leaves-label">Upcoming Filed Leaves (Click to auto-fill)</div><div class="suggested-leaves-wrapper">';
   blocks.forEach((block, index) => {
     let label = "";
     if(block.length === 1) {
       label = block[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
     } else {
       const s = block[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
       const e = block[block.length-1].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
       label = `${s} - ${e} (${block.length} Days)`;
     }
     html += `<div class="suggested-leave-chip" onclick="selectSuggestedLeave(${index})"><span class="material-icons-round" style="font-size:12px;">event_available</span> ${label}</div>`;
   });
   html += '</div>';

}

function formatDateToYYYYMMDD(d) {
   const y = d.getFullYear();
   const m = String(d.getMonth() + 1).padStart(2, '0');
   const day = String(d.getDate()).padStart(2, '0');
   return `${y}-${m}-${day}`;
}

function selectSuggestedLeave(blockIndex) {
  const block = window.currentResourceLeaveBlocks[blockIndex];
  if(!block) return;
  document.getElementById('handoffDateUI').value = formatDateToYYYYMMDD(block[0]);
  triggerLivePreviewRefresh(block);
}

function onHandoffDateChange() {
  const name = document.getElementById('handoffResourceUI').value;
  const manualDateStr = document.getElementById('handoffDateUI').value;
  if(!name || !manualDateStr) return;
  const blocks = getUserLeaveBlocks(name);
  let matchedBlock = null;
  for (const block of blocks) {
    const bStart = formatDateToYYYYMMDD(block[0]);
    if (bStart === manualDateStr) {
      matchedBlock = block;
      break;
    }
  }

  if (matchedBlock) {
    triggerLivePreviewRefresh(matchedBlock);
  } else {
    const parts = manualDateStr.split('-');
    const d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    triggerLivePreviewRefresh([d]);
  }
}

function triggerLivePreviewRefresh(blockDatesArray) {
  const name = document.getElementById('handoffResourceUI').value;
  if (!name) return;

  if(!blockDatesArray || blockDatesArray.length === 0) {
    const fallbackStr = document.getElementById('handoffDateUI').value;
    if(!fallbackStr) return;
    const parts = fallbackStr.split('-');
    blockDatesArray = [new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10))];
  }
  
  const dateStringsForBackend = blockDatesArray.map(d => formatDateToYYYYMMDD(d));
  
  let dateHeaderStr = "";
  if (blockDatesArray.length === 1) {
     dateHeaderStr = blockDatesArray[0].toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', weekday: 'long' });
  } else {
     dateHeaderStr = blockDatesArray[0].toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', weekday: 'long' }) + " to " + blockDatesArray[blockDatesArray.length - 1].toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', weekday: 'long' });
  }
  pendingHandoffDatesStr = dateHeaderStr;
  pendingHandoffResource = name;

  showToastNotification("Scanning active registry for deliverables...");
  document.getElementById('executeDraftBtnUI').disabled = true;
  
  google.script.run
    .withSuccessHandler(res => {
      if(res.success && res.data.length > 0) {
        pendingHandoffData = res.data;
        const tasksNeedingReassignment = res.data.filter(t => t.requiresReassignment);
        
        if (tasksNeedingReassignment.length > 0) {
           triggerReassignmentModal(tasksNeedingReassignment, dateStringsForBackend[0]);
        } else {
           renderHandoffEmailPreview(res.data, res.signature);
        }
      } else {
         renderEmptyHandoff(res.signature);
      }
    })
    .fetchHandoffDataForUI(name, JSON.stringify(dateStringsForBackend), JSON.stringify(monthlyLeavesCache));
}

// 🚀 ADVANCED TITLE CLEANER REGEX
function cleanSOPTitle(title) {
  return title.replace(/^(?:VLC_\d+_SOP|\[Draft\]_SOP|\d+_SOP|SOP -|SOP:|\d+_)\s*/ig, "").trim();
}

function getAvatarColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
  const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
  return "#" + "00000".substring(0, 6 - c.length) + c;
}

function loadSOPLibrary() {
  const container = document.getElementById('sopListContainer');
  if (cachedSOPData.length === 0) {
     container.innerHTML = `<div style="text-align:center; margin-top:40px; color:var(--sub);"><span class="material-icons-round spinning-icon" style="font-size:24px;">sync</span><br><br>Accessing Secure Database...</div>`;
  }
  
  google.script.run
    .withSuccessHandler((res) => { 
      if (res.success) { 
        cachedSOPData = res.data; 
        
        // Restore view preference
        const savedView = localStorage.getItem('pexHubSopView') || 'list';
        setSOPView(savedView);

      } else {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--red); font-weight:600;">⚠️ Error loading SOPs: ${res.message}</div>`;
        handleSystemError("SOP Fetch Failed", res.message);
      }
    })
    .withFailureHandler((err) => {
      container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--red); font-weight:600;">⚠️ Connection Error: ${err.message}</div>`;
      handleSystemError("SOP Engine Connection Error", err.message);

// 🚀 SORTING LOGIC
function handleSOPSort() {
  currentSortMode = document.getElementById('sopSortSelect').value;
  handleSOPSearch(); 
}

function getSortedData(dataArray) {
  return dataArray.slice().sort((a, b) => {
    if (currentSortMode === 'name') {
      return cleanSOPTitle(a.title).localeCompare(cleanSOPTitle(b.title));
    } else if (currentSortMode === 'updated') {
      let dateA = new Date(a.lastUpdatedBy).getTime();
      let dateB = new Date(b.lastUpdatedBy).getTime();
      return (isNaN(dateB) ? 0 : dateB) - (isNaN(dateA) ? 0 : dateA); 
    } else if (currentSortMode === 'created') {
      let dateA = new Date(a.createdDate).getTime();
      let dateB = new Date(b.createdDate).getTime();
      return (isNaN(dateB) ? 0 : dateB) - (isNaN(dateA) ? 0 : dateA); 
    }
    return 0;
  });
}

let isResizingDrawer = false;
document.addEventListener('DOMContentLoaded', () => {
  const drawer = document.getElementById('sopDrawer');
  const resizer = document.getElementById('drawerResizer');
  
  if(resizer) {
    resizer.addEventListener('mousedown', (e) => {
      isResizingDrawer = true;
      document.body.style.cursor = 'ew-resize';
      document.getElementById('drawerIframe').style.pointerEvents = 'none';
      e.preventDefault(); 
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizingDrawer) return;
      let newWidth = window.innerWidth - e.clientX;
      if (newWidth < 450) newWidth = 450;
      if (newWidth > window.innerWidth * 0.85) newWidth = window.innerWidth * 0.85;
      drawer.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (isResizingDrawer) {
        isResizingDrawer = false;
        document.body.style.cursor = '';
        document.getElementById('drawerIframe').style.pointerEvents = 'auto';
      }
    });
  }
});

// 🚀 KPI DRAWER RESIZER LOGIC
let isResizingKPIDrawer = false;

document.addEventListener('DOMContentLoaded', () => {
  const kpiDrawer = document.getElementById('kpiDrawer');
  const kpiResizer = document.getElementById('kpiDrawerResizer');
  const kpiIframe = document.getElementById('kpiDrawerIframe');
  
  if (kpiResizer) {
    kpiResizer.addEventListener('mousedown', (e) => {
      isResizingKPIDrawer = true;
      document.body.style.cursor = 'ew-resize';
      if (kpiIframe) kpiIframe.style.pointerEvents = 'none';
      e.preventDefault(); 
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizingKPIDrawer) return;
      let newWidth = window.innerWidth - e.clientX;
      if (newWidth < 450) newWidth = 450;
      if (newWidth > window.innerWidth * 0.90) newWidth = window.innerWidth * 0.90;
      if (kpiDrawer) kpiDrawer.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (isResizingKPIDrawer) {
        isResizingKPIDrawer = false;
        document.body.style.cursor = '';
        if (kpiIframe) kpiIframe.style.pointerEvents = 'auto';
      }
    });
  }
});
</script>
